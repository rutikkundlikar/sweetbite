{% extends 'base.html' %}

{% block content %}
<h2>Login</h2>

<form method="POST" style="max-width:300px;">
    <label>Email:</label>
    <input type="email" name="email" required
           style="width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc;">
    
    <button type="submit"
            style="width:100%; padding:10px; background:#ff5c8a; color:white; border:none; border-radius:8px;">
        Login
    </button>
</form>

{% endblock %}
